name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix Android SDK Permissions & Accept Licenses
        run: |
          sudo chmod -R 777 "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Use Existing app_key.keystore
        run: |
          mkdir -p ~/.android
          if [ -f "app_key.keystore" ]; then
            cp app_key.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore app_key.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp app_key.keystore ~/.android/debug.keystore
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project, configure Fingerprint & add packages
        run: |
          mkdir temp_code
          cp -r lib/* temp_code/
          rm -f pubspec.yaml pubspec.lock
          flutter create --org com.rafeeq.easyrent --project-name easyrent_tracker .
          sed -i 's/android:label="easyrent_tracker"/android:label="EasyRent Tracker"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>/' android/app/src/main/AndroidManifest.xml
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt")
          if [ -n "$MAIN_KT" ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_KT"
          fi
          rm -rf lib/*
          cp -r temp_code/* lib/
          rm -rf temp_code
          flutter pub add shared_preferences share_plus local_auth url_launcher

      - name: Build Release APK with Auto Version
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyRent-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
