name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix Android SDK Permissions & Accept Licenses
        run: |
          sudo chmod -R 777 $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Permanent Signing Key
        run: |
          mkdir -p ~/.android
          if [ -f "app_key.keystore" ]; then
            cp app_key.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore app_key.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp app_key.keystore ~/.android/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app_key.keystore
            git commit -m "Save permanent signing key [skip ci]" || true
            git push || true
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure & add packages
        run: |
          mkdir temp_code
          cp -r lib/* temp_code/
          flutter create --org com.easyrent.tracker --project-name easyrent_tracker .
          cp -r temp_code/* lib/
          rm -rf temp_code
          flutter pub add shared_preferences share_plus

      - name: Build Release APK with Auto Version
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyRent-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
