name: Build EasyRent APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Project & Add Dependencies
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name easy_rent_tracker --org com.easyrent.tracker .
          cp /tmp/main.dart lib/main.dart
          sed -i 's/android:label="easy_rent_tracker"/android:label="EasyRent Tracker"/g' android/app/src/main/AndroidManifest.xml
          flutter pub add shared_preferences

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyRent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
