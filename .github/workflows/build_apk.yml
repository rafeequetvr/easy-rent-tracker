name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure & add packages
        run: |
          mkdir temp_code
          cp -r lib/* temp_code/
          flutter create --org com.easyrent.tracker --project-name easyrent_tracker .
          cp -r temp_code/* lib/
          rm -rf temp_code
          flutter pub add shared_preferences share_plus

      - name: Build Release APK with Auto Version
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyRent-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
